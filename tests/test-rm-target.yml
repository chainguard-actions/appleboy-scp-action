name: Test SCP with rm (remove target before upload)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH server and source files
        run: |
          # Install openssh-server
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

          # Generate a key pair for the test
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N ""

          # Set up the SSH server to accept the key for the current user
          mkdir -p "$HOME/.ssh"
          cat /tmp/test_key.pub >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"

          # Configure sshd
          sudo mkdir -p /run/sshd
          echo "PubkeyAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication no" | sudo tee -a /etc/ssh/sshd_config

          # Start sshd on port 2222 to avoid conflicts
          sudo /usr/sbin/sshd -p 2222 -D &
          sleep 3

          # Create a target directory with a pre-existing file that should be removed
          mkdir -p /tmp/scp-rm-target
          chmod 777 /tmp/scp-rm-target
          echo "old file that should be removed" > /tmp/scp-rm-target/old-file.txt

          # Create source file INSIDE the workspace so Docker can access it
          echo "new file content" > "$GITHUB_WORKSPACE/new-file.txt"

          # Store the private key content for the action
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Get the host IP reachable from inside Docker container
          HOST_IP=$(ip route | awk '/default/ {print $3}' | head -1)
          if [ -z "$HOST_IP" ]; then
            HOST_IP="172.17.0.1"
          fi
          echo "HOST_IP=$HOST_IP" >> $GITHUB_ENV
          echo "Using host IP: $HOST_IP"

          # Get the current username
          echo "SSH_USER=$(whoami)" >> $GITHUB_ENV

      - name: Verify old file exists before action
        run: |
          if [ ! -f "/tmp/scp-rm-target/old-file.txt" ]; then
            echo "FAIL: pre-existing file should exist before action runs"
            exit 1
          fi
          echo "Pre-existing file confirmed: /tmp/scp-rm-target/old-file.txt"

      - id: scp
        name: Run SCP action with rm=true
        uses: .
        with:
          host: ${{ env.HOST_IP }}
          port: 2222
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "new-file.txt"
          target: /tmp/scp-rm-target
          rm: true
          debug: true
          timeout: 30s
          command_timeout: 2m
          use_insecure_cipher: true

      - name: Assert new file transferred and old file removed
        run: |
          echo "Contents of /tmp/scp-rm-target:"
          find /tmp/scp-rm-target -type f 2>/dev/null || echo "(empty)"

          # Check new file is present
          if find /tmp/scp-rm-target -name "new-file.txt" | grep -q .; then
            echo "PASS: new file was transferred successfully"
          else
            echo "FAIL: new file was not transferred"
            exit 1
          fi

          # Check old file is gone (rm=true should have removed the target dir first)
          if [ -f "/tmp/scp-rm-target/old-file.txt" ]; then
            echo "FAIL: old file should have been removed by rm=true"
            exit 1
          fi
          echo "PASS: old file was removed as expected"
