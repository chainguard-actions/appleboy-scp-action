name: Test basic SCP with password auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source file
        run: |
          echo "hello world" > /tmp/test-upload.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: 22
          username: "testuser"
          password: "testpassword"
          source: "/tmp/test-upload.txt"
          target: "/tmp/remote-target"
          timeout: "5s"
          command_timeout: "30s"
          debug: true
          rm: false
          overwrite: false
          tar_dereference: false
          strip_components: 0
          use_insecure_cipher: false
      - name: Assert action ran (connection failure expected for unreachable host)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because 192.0.2.1 is not reachable.
          # We only verify the action was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (connection failure is expected)"
