name: Test basic SCP with password auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: 22
          username: "testuser"
          password: "testpassword"
          source: "README.md"
          target: "/tmp/scp-test"
          timeout: "5s"
          command_timeout: "30s"
          rm: false
          debug: true
          strip_components: 0
          overwrite: false
          tar_dereference: false
          tar_exec: "tar"
          use_insecure_cipher: false
      - name: Assert action ran (connection failure expected with fake host)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail since 192.0.2.1 is a TEST-NET address
          # We just verify it ran (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
