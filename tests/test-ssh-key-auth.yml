name: Test SSH key authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a temporary SSH key pair for input coverage
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "test-passphrase" -q
          echo "SSH key generated"
      - id: action
        name: Run action with SSH key auth inputs (expect failure - no real server)
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: "22"
          username: "testuser"
          key: ${{ 'dummy-key-content-for-coverage' }}
          passphrase: "test-passphrase"
          fingerprint: "SHA256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          use_insecure_cipher: "true"
          target: "/tmp/test-target"
          source: "."
          timeout: "5s"
      - name: Assert action ran (connection failure is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because 192.0.2.1 is not reachable
          # We just need to verify the inputs were accepted and the action ran
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with SSH key auth inputs (failure due to unreachable host is expected)"
