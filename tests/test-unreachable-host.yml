name: Test unreachable host fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy source file
        run: |
          echo "hello world" > /tmp/test-file.txt

      - id: action
        name: Run SCP action with unreachable host (expect failure)
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "19922"
          username: "testuser"
          password: "testpassword"
          source: "/tmp/test-file.txt"
          target: "/tmp/remote-target"
          timeout: "5s"
          command_timeout: "10s"

      - name: Assert action failed due to unreachable host
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action succeeded when it should have failed (host is unreachable)"
            exit 1
          fi
          echo "PASS: action did not succeed as expected (outcome=$OUTCOME)"
