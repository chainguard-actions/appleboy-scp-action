name: Test SCP with SSH key authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source file and dummy key files
        run: |
          echo "test content" > /tmp/test-key-upload.txt
          # Create a dummy key file path (not a real key)
          echo "-----BEGIN RSA PRIVATE KEY-----" > /tmp/dummy_key
          echo "dummykeydata" >> /tmp/dummy_key
          echo "-----END RSA PRIVATE KEY-----" >> /tmp/dummy_key
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.2"
          port: 22
          username: "keyuser"
          key: "-----BEGIN RSA PRIVATE KEY-----\ndummykeydata\n-----END RSA PRIVATE KEY-----"
          key_path: "/tmp/dummy_key"
          passphrase: "mykeypassphrase"
          fingerprint: "SHA256:dummyfingerprint1234567890abcdefghijklmnopqrstuvwxyz"
          source: "/tmp/test-key-upload.txt"
          target: "/tmp/remote-key-target"
          timeout: "5s"
          command_timeout: "30s"
          debug: true
      - name: Assert action ran (connection failure expected for unreachable host)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (connection failure is expected for dummy host)"
