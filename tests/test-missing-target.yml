name: Test missing target input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without target (expect failure)
        id: action
        uses: .
        with:
          host: 192.0.2.1
          port: 22
          username: testuser
          password: testpassword
          source: README.md
          timeout: 5s
          command_timeout: 10s
        continue-on-error: true
      - name: Assert action failed due to missing target
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when target is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when target is missing"
