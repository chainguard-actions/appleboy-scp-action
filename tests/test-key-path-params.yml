name: Test key_path, passphrase, fingerprint, and tar_tmp_path parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a dummy SSH key for key_path testing
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_id_rsa -N "testpassphrase" -q
      - name: Run action with key_path, passphrase, fingerprint, and tar_tmp_path (expect failure on connection)
        id: action
        uses: .
        with:
          host: 192.0.2.1
          port: 22
          username: testuser
          key_path: /tmp/test_id_rsa
          passphrase: testpassphrase
          fingerprint: SHA256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          target: /tmp/remote-target
          source: README.md
          timeout: 5s
          command_timeout: 10s
          tar_tmp_path: /tmp/scp-tar-staging
          debug: true
        continue-on-error: true
      - name: Assert action failed (connection refused, not a parameter error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when host is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly handled key_path/passphrase/fingerprint/tar_tmp_path and failed on connection"
