name: Test proxy connection inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate temporary SSH key for proxy input coverage
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/proxy_key -N "proxy-passphrase" -q
          echo "Proxy SSH key generated"
      - id: action
        name: Run action with proxy connection inputs (expect failure - no real server)
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          proxy_host: "192.0.2.2"
          proxy_port: "22"
          proxy_username: "proxyuser"
          proxy_password: "proxypassword"
          proxy_key: "dummy-proxy-key-content-for-coverage"
          proxy_key_path: "/tmp/proxy_key"
          proxy_passphrase: "proxy-passphrase"
          proxy_fingerprint: "SHA256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          proxy_use_insecure_cipher: "true"
          target: "/tmp/test-target"
          source: "."
          timeout: "5s"
          proxy_timeout: "5s"
      - name: Assert action ran (connection failure is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because 192.0.2.2 (proxy) is not reachable
          # We just need to verify the inputs were accepted and the action ran
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with proxy connection inputs (failure due to unreachable host is expected)"
