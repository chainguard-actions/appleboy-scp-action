name: Test SCP with proxy configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.3"
          port: 22
          username: "proxyuser"
          password: "proxypassword"
          source: "README.md"
          target: "/tmp/scp-proxy-test"
          timeout: "5s"
          command_timeout: "30s"
          debug: true
          proxy_host: "192.0.2.4"
          proxy_port: 22
          proxy_username: "proxy-ssh-user"
          proxy_password: "proxy-ssh-password"
          proxy_passphrase: "proxy-key-passphrase"
          proxy_timeout: "5s"
          proxy_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqCMhABGMowBBBBBBBBB
            BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          proxy_key_path: "/tmp/fake-proxy-key-path"
          proxy_fingerprint: "SHA256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          proxy_use_insecure_cipher: false
      - name: Assert action ran (connection failure expected with fake host)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
