name: Test SCP with strip_components
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH server and source files
        run: |
          # Install openssh-server
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

          # Generate a key pair for the test
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N ""

          # Set up the SSH server to accept the key for the current user
          mkdir -p "$HOME/.ssh"
          cat /tmp/test_key.pub >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"

          # Configure sshd
          sudo mkdir -p /run/sshd
          echo "PubkeyAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication no" | sudo tee -a /etc/ssh/sshd_config

          # Start sshd on port 2222 to avoid conflicts
          sudo /usr/sbin/sshd -p 2222 -D &
          sleep 3

          # Create nested source directory structure INSIDE the workspace
          mkdir -p "$GITHUB_WORKSPACE/src/subdir"
          echo "nested file content" > "$GITHUB_WORKSPACE/src/subdir/nested.txt"

          # Create a target directory on the "remote" host (localhost)
          mkdir -p /tmp/scp-strip-target
          chmod 777 /tmp/scp-strip-target

          # Store the private key content for the action
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Get the host IP reachable from inside Docker container
          HOST_IP=$(ip route | awk '/default/ {print $3}' | head -1)
          if [ -z "$HOST_IP" ]; then
            HOST_IP="172.17.0.1"
          fi
          echo "HOST_IP=$HOST_IP" >> $GITHUB_ENV
          echo "Using host IP: $HOST_IP"

          # Get the current username
          echo "SSH_USER=$(whoami)" >> $GITHUB_ENV

      - id: scp
        name: Run SCP action with strip_components=2
        uses: .
        with:
          host: ${{ env.HOST_IP }}
          port: 2222
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "src/subdir/nested.txt"
          target: /tmp/scp-strip-target
          strip_components: 2
          debug: true
          timeout: 30s
          command_timeout: 2m
          use_insecure_cipher: true

      - name: Assert file was transferred with stripped path
        run: |
          echo "Checking if file was transferred with stripped path..."
          echo "Contents of /tmp/scp-strip-target:"
          find /tmp/scp-strip-target -type f 2>/dev/null || echo "(empty)"
          # With strip_components=2, src/subdir/nested.txt -> nested.txt
          if [ -f "/tmp/scp-strip-target/nested.txt" ]; then
            echo "PASS: file was transferred with path components stripped"
          else
            echo "FAIL: expected stripped file not found at /tmp/scp-strip-target/nested.txt"
            exit 1
          fi
