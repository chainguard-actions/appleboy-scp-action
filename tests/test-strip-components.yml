name: Test SCP with strip_components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH server and prepare nested source files
        run: |
          # Install openssh-server if not present
          which sshd || (apt-get update -qq && apt-get install -y -qq openssh-server)

          # Generate SSH key pair for the test
          mkdir -p "$GITHUB_WORKSPACE/.ssh-test"
          ssh-keygen -t rsa -b 2048 -f "$GITHUB_WORKSPACE/.ssh-test/id_rsa" -N "" -q

          # Set up root's authorized_keys
          mkdir -p /root/.ssh
          cat "$GITHUB_WORKSPACE/.ssh-test/id_rsa.pub" >> /root/.ssh/authorized_keys
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/authorized_keys

          # Configure and start sshd on port 2222
          mkdir -p /run/sshd
          ssh-keygen -A 2>/dev/null || true
          /usr/sbin/sshd -p 2222 \
            -o "PermitRootLogin yes" \
            -o "PubkeyAuthentication yes" \
            -o "PasswordAuthentication no" \
            -o "StrictModes no" \
            -o "ListenAddress 0.0.0.0"
          sleep 2

          # Create nested source directory structure INSIDE GITHUB_WORKSPACE
          mkdir -p "$GITHUB_WORKSPACE/nested/subdir"
          echo "nested file content" > "$GITHUB_WORKSPACE/nested/subdir/nested-file.txt"

          # Create target directory on the host
          mkdir -p /tmp/scp-strip-target
          chmod 777 /tmp/scp-strip-target

          # Store private key content as multiline env var
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat "$GITHUB_WORKSPACE/.ssh-test/id_rsa" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Under act, Docker actions run with --network host, so 127.0.0.1 works
          echo "SSH_HOST=127.0.0.1" >> $GITHUB_ENV

      - id: scp
        name: Run SCP action with strip_components=2
        uses: .
        with:
          host: ${{ env.SSH_HOST }}
          port: 2222
          username: root
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "nested/subdir/nested-file.txt"
          target: /tmp/scp-strip-target
          strip_components: 2
          use_insecure_cipher: true
          debug: true

      - name: Assert file was transferred with stripped path
        run: |
          echo "Checking target directory contents..."
          find /tmp/scp-strip-target -type f 2>/dev/null || echo "(no files found)"
          # With strip_components=2, nested/subdir/nested-file.txt
          # strips 2 leading components: nested, subdir -> nested-file.txt at root of target
          if find /tmp/scp-strip-target -name "nested-file.txt" 2>/dev/null | grep -q "nested-file.txt"; then
            echo "PASS: file found in target with stripped path"
          else
            echo "FAIL: file not found in target after strip_components"
            exit 1
          fi
