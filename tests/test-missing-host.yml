name: Test missing host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no host (expect failure)
        id: action
        uses: .
        with:
          username: testuser
          password: testpassword
          target: /tmp/test
          source: README.md
        continue-on-error: true
      - name: Assert action failed due to missing host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no host is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when host was not provided"
