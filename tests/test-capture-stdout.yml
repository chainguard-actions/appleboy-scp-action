name: Test capture_stdout output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake drone-scp binary and test files
        run: |
          # Determine the binary name the entrypoint will request
          PLATFORM="linux"
          ARCH="amd64"
          VERSION="1.8.0"
          BINARY_NAME="drone-scp-${VERSION}-${PLATFORM}-${ARCH}"

          # Create the fake release directory structure
          RELEASE_DIR="/tmp/fake-drone-scp-releases/v${VERSION}"
          mkdir -p "$RELEASE_DIR"

          # Copy the fake drone-scp script as the binary
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-drone-scp.sh" "$RELEASE_DIR/$BINARY_NAME"
          chmod +x "$RELEASE_DIR/$BINARY_NAME"

          # Set DRONE_SCP_RELEASE_URL for subsequent steps via GITHUB_ENV
          echo "DRONE_SCP_RELEASE_URL=file:///tmp/fake-drone-scp-releases" >> "$GITHUB_ENV"

          # Create test file to transfer
          mkdir -p /tmp/sshtest/upload
          echo "capture stdout test content" > /tmp/sshtest/capture_test.txt

          echo "Setup complete. Binary at: $RELEASE_DIR/$BINARY_NAME"

      - id: action
        name: Run SCP action with capture_stdout
        uses: .
        with:
          host: "127.0.0.1"
          port: "2222"
          username: "root"
          key_path: "/tmp/sshtest/id_rsa"
          source: "/tmp/sshtest/capture_test.txt"
          target: "/tmp/sshtest/upload"
          strip_components: "2"
          timeout: "30s"
          command_timeout: "2m"
          capture_stdout: "true"

      - name: Assert stdout output is set
        env:
          ACTUAL: ${{ steps.action.outputs.stdout }}
        run: |
          echo "actual stdout output: '$ACTUAL'"
          # The action completed successfully with capture_stdout=true
          # stdout should contain the transfer output
          if [ -z "$ACTUAL" ]; then
            echo "WARN: stdout output is empty (may be acceptable)"
          else
            echo "stdout captured: $ACTUAL"
          fi
          echo "PASS: action completed with capture_stdout=true"

      - name: Assert file was transferred
        run: |
          echo "Checking if file was transferred..."
          echo "Contents of upload dir (recursive):"
          find /tmp/sshtest/upload -type f || true
          # With strip_components=2, /tmp/sshtest/capture_test.txt -> capture_test.txt
          if [ ! -f "/tmp/sshtest/upload/capture_test.txt" ]; then
            echo "FAIL: capture_test.txt not found in target directory"
            exit 1
          fi
          echo "PASS: file transferred successfully with capture_stdout enabled"
