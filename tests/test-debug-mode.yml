name: Test debug mode and multiple source files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake drone-scp binary and test files
        run: |
          # Determine the binary name the entrypoint will request
          PLATFORM="linux"
          ARCH="amd64"
          VERSION="1.8.0"
          BINARY_NAME="drone-scp-${VERSION}-${PLATFORM}-${ARCH}"

          # Create the fake release directory structure
          RELEASE_DIR="/tmp/fake-drone-scp-releases/v${VERSION}"
          mkdir -p "$RELEASE_DIR"

          # Copy the fake drone-scp script as the binary
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-drone-scp.sh" "$RELEASE_DIR/$BINARY_NAME"
          chmod +x "$RELEASE_DIR/$BINARY_NAME"

          # Set DRONE_SCP_RELEASE_URL for subsequent steps via GITHUB_ENV
          echo "DRONE_SCP_RELEASE_URL=file:///tmp/fake-drone-scp-releases" >> "$GITHUB_ENV"

          # Create multiple test files to transfer
          mkdir -p /tmp/sshtest/upload
          echo "file one content" > /tmp/sshtest/file1.txt
          echo "file two content" > /tmp/sshtest/file2.txt
          echo "file three content" > /tmp/sshtest/file3.txt

          echo "Setup complete. Binary at: $RELEASE_DIR/$BINARY_NAME"

      - id: action
        name: Run SCP action with debug=true and multiple sources
        uses: .
        with:
          host: "127.0.0.1"
          port: "2222"
          username: "root"
          key_path: "/tmp/sshtest/id_rsa"
          source: |
            /tmp/sshtest/file1.txt
            /tmp/sshtest/file2.txt
            /tmp/sshtest/file3.txt
          target: "/tmp/sshtest/upload"
          strip_components: "2"
          debug: "true"
          timeout: "30s"
          command_timeout: "2m"

      - name: Assert all files were transferred
        run: |
          echo "Checking if all files were transferred..."
          echo "Contents of upload dir (recursive):"
          find /tmp/sshtest/upload -type f || true
          FAILED=0
          # With strip_components=2, /tmp/sshtest/fileN.txt -> fileN.txt
          for f in file1.txt file2.txt file3.txt; do
            if [ ! -f "/tmp/sshtest/upload/$f" ]; then
              echo "FAIL: $f not found in target directory"
              FAILED=1
            else
              echo "OK: $f found"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "PASS: all files transferred successfully with debug mode"
