name: Test SCP basic password auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source file
        run: |
          echo "test content" > /tmp/test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: 22
          username: "testuser"
          password: "testpassword"
          source: "/tmp/test-file.txt"
          target: "/tmp/remote-target"
          timeout: "5s"
          command_timeout: "10s"
          rm: false
          debug: true
          strip_components: 0
          overwrite: false
          tar_dereference: false
          tar_exec: "tar"
          use_insecure_cipher: false
      - name: Assert action ran (connection failure expected with fake host)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail since there's no real SSH server
          # We just verify the inputs were accepted and the action attempted to run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with password auth inputs"
