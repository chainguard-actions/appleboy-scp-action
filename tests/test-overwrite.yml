name: Test overwrite feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake drone-scp binary and test files
        run: |
          # Determine the binary name the entrypoint will request
          PLATFORM="linux"
          ARCH="amd64"
          VERSION="1.8.0"
          BINARY_NAME="drone-scp-${VERSION}-${PLATFORM}-${ARCH}"

          # Create the fake release directory structure
          RELEASE_DIR="/tmp/fake-drone-scp-releases/v${VERSION}"
          mkdir -p "$RELEASE_DIR"

          # Copy the fake drone-scp script as the binary
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-drone-scp.sh" "$RELEASE_DIR/$BINARY_NAME"
          chmod +x "$RELEASE_DIR/$BINARY_NAME"

          # Set DRONE_SCP_RELEASE_URL for subsequent steps via GITHUB_ENV
          echo "DRONE_SCP_RELEASE_URL=file:///tmp/fake-drone-scp-releases" >> "$GITHUB_ENV"

          # Create target directory and initial file
          mkdir -p /tmp/sshtest/upload
          echo "original content" > /tmp/sshtest/overwrite_test.txt

          echo "Setup complete. Binary at: $RELEASE_DIR/$BINARY_NAME"

      - name: First transfer (initial upload)
        uses: .
        with:
          host: "127.0.0.1"
          port: "2222"
          username: "root"
          key_path: "/tmp/sshtest/id_rsa"
          source: "/tmp/sshtest/overwrite_test.txt"
          target: "/tmp/sshtest/upload"
          strip_components: "2"
          timeout: "30s"
          command_timeout: "2m"

      - name: Update source file content
        run: |
          echo "updated content" > /tmp/sshtest/overwrite_test.txt

      - id: action
        name: Second transfer with overwrite=true
        uses: .
        with:
          host: "127.0.0.1"
          port: "2222"
          username: "root"
          key_path: "/tmp/sshtest/id_rsa"
          source: "/tmp/sshtest/overwrite_test.txt"
          target: "/tmp/sshtest/upload"
          strip_components: "2"
          overwrite: "true"
          timeout: "30s"
          command_timeout: "2m"

      - name: Assert file was overwritten with new content
        run: |
          echo "Checking if file was overwritten..."
          echo "Contents of upload dir (recursive):"
          find /tmp/sshtest/upload -type f || true
          # With strip_components=2, /tmp/sshtest/overwrite_test.txt -> overwrite_test.txt
          if [ ! -f "/tmp/sshtest/upload/overwrite_test.txt" ]; then
            echo "FAIL: overwrite_test.txt not found in target directory"
            exit 1
          fi
          CONTENT=$(cat /tmp/sshtest/upload/overwrite_test.txt)
          echo "actual content: $CONTENT"
          if [ "$CONTENT" != "updated content" ]; then
            echo "FAIL: expected 'updated content' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: file overwritten successfully"
