name: Test SCP with tar options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.5"
          port: 22
          username: "taruser"
          password: "tarpassword"
          source: "README.md"
          target: "/tmp/scp-tar-test"
          timeout: "5s"
          command_timeout: "30s"
          debug: true
          strip_components: 1
          overwrite: true
          tar_dereference: true
          tar_tmp_path: "/tmp/scp-tar-tmp"
          tar_exec: "tar"
          rm: true
      - name: Assert action ran (connection failure expected with fake host)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
