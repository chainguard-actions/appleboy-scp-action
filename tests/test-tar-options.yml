name: Test tar options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        name: Run action with tar options inputs (expect failure - no real server)
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          target: "/tmp/test-target"
          source: "."
          tar_dereference: "true"
          tar_tmp_path: "/tmp/scp-tar-staging"
          timeout: "5s"
      - name: Assert action ran (connection failure is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because 192.0.2.1 is not reachable
          # We just need to verify the inputs were accepted and the action ran
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with tar options inputs (failure due to unreachable host is expected)"
